# Default values for duo-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: ghcr.io/userofficeproject/user-office-backend
  tag: develop
  pullPolicy: Always

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: duo-db-svcbind-custom-user
        key: uri

envFrom: {}

configmap:
  data:
    RABBITMQ_CORE_EXCHANGE_NAME: ""
    RABBITMQ_CORE_QUEUE_NAME: ""

secret:
  data:
    secret: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name:

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: true
  pathType: ImplementationSpecific
  paths:
    - /download
    - /preview
    - /downloads
    - /uploads
    - /files
    - /graphql
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.org/client-max-body-size: "16m"
    # Increase read/send timeouts from the default 60s to 600s (10 min).
    # Without this, nginx kills long-running connections (e.g. PDF generation
    # via the factory service).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

livenessProbePath: /health

readinessProbePath: /readiness

postfix: ""
