global:
  databases:
    core:
      secretName: duo-database
      host: ""
      port: 5432
      database: ""
      username: ""
      password: ""
      sslMode: require
    scheduler:
      secretName: scheduler-database
      host: ""
      port: 5432
      database: ""
      username: ""
      password: ""
      sslMode: require

duo-frontend:
  fullnameOverride: duo-frontend
  replicaCount: 1
  ingress:
    enabled: true
    host: localhost

duo-backend:
  fullnameOverride: duo-backend
  replicaCount: 1
  ingress:
    enabled: true
    host: localhost
  configmap:
    data:
      AUTH_CLIENT_ID: # Client ID for OIDC
      AUTH_CLIENT_SECRET: # Secret for OIDC
      AUTH_DISCOVERY_URL: # Well-known URL for OIDC
      NODE_ENV: development
      TZ: Europe/Stockholm
      BASE_URL: localhost:4000
      JWT_TOKEN_LIFE: 7d
      JWT_SECRET: secret
      DATE_FORMAT: dd-MM-yyyy
      DATE_TIME_FORMAT: dd-MM-yyyy HH:mm
      USER_OFFICE_FACTORY_ENDPOINT: http://duo-factory:4500/generate

duo-factory:
  fullnameOverride: duo-factory

scheduler:
  enabled: false

duo-gateway:
  fullnameOverride: duo-gateway

duo-scheduler-backend:
  fullnameOverride: duo-scheduler-backend

duo-scheduler-frontend:
  fullnameOverride: duo-scheduler-frontend

rabbitmq:
  enabled: false
  fullnameOverride: duo-rabbitmq
  image:
    repository: rabbitmq
    tag: 3.13.7-management
    pullPolicy: IfNotPresent
  auth:
    username: ""
    password: ""
    secretName: duo-rabbitmq-svcbind
  persistence:
    enabled: false
    mode: dynamic
    size: 8Gi
    accessModes:
      - ReadWriteMany
    storageClass: nfs-storage
    existingClaim: ""
    mountOptions: []
    static:
      server: ""
      path: ""
      persistentVolumeName: ""
