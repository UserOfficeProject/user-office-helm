global:
  databases:
    core:
      secretName: duo-core-database
    scheduler:
      secretName: duo-scheduler-database

duo-frontend:
  fullnameOverride: duo-frontend
  replicaCount: 1
  ingress:
    enabled: true
    host: localhost

# chat-uos: agent chat at <duo-frontend host>/chat-uos. It reads the User Office
# session from localStorage, so it must share the User Office hostname.
# Set N8N_WEBHOOK_URL per environment; the container refuses to start without it.
duo-chat-uos:
  enabled: false
  fullnameOverride: duo-chat-uos
  replicaCount: 1
  image:
    repository: ghcr.io/userofficeproject/chat-uos
    tag: latest
  ingress:
    enabled: true
    host: localhost
    pathType: Prefix
    paths:
      - /chat-uos
  env:
    # n8n Chat Trigger (webhook mode) URL of the agent; required.
    - name: N8N_WEBHOOK_URL
      value: ""
    # Where "Sign in" and "User Office" links point; "/" is the same host.
    - name: USER_OFFICE_URL
      value: /

duo-backend:
  fullnameOverride: duo-backend
  replicaCount: 1
  ingress:
    enabled: true
    host: localhost
  configmap:
    data:
      AUTH_CLIENT_ID: # Client ID for OIDC
      AUTH_CLIENT_SECRET: # Secret for OIDC
      AUTH_DISCOVERY_URL: # Well-known URL for OIDC
      NODE_ENV: development
      TZ: Europe/Stockholm
      BASE_URL: localhost:4000
      JWT_TOKEN_LIFE: 7d
      JWT_SECRET: secret
      DATE_FORMAT: dd-MM-yyyy
      DATE_TIME_FORMAT: dd-MM-yyyy HH:mm
      USER_OFFICE_FACTORY_ENDPOINT: http://duo-factory:4500/generate

duo-factory:
  fullnameOverride: duo-factory

scheduler:
  enabled: false

duo-gateway:
  fullnameOverride: duo-gateway

duo-scheduler-backend:
  fullnameOverride: duo-scheduler-backend

duo-scheduler-frontend:
  fullnameOverride: duo-scheduler-frontend

rabbitmq:
  enabled: false
  fullnameOverride: duo-rabbitmq
  image:
    repository: rabbitmq
    tag: 3.13.7-management
    pullPolicy: IfNotPresent
  auth:
    secretName: duo-rabbitmq-svcbind
  persistence:
    enabled: false
    mode: dynamic
    size: 8Gi
    accessModes:
      - ReadWriteMany
    storageClass: nfs-storage
    existingClaim: ""
    mountOptions: []
    static:
      server: ""
      path: ""
      persistentVolumeName: ""

# Application Secrets are synced from Vault by the Vault Secrets Operator (VSO),
# one VaultStaticSecret per entry, read from <mount>/<pathPrefix>/<path|name>.
# Uses the operator's default VaultAuth unless authRef is set.
vault:
  authRef: ""
  mount: static
  type: kv-v2
  pathPrefix: ""  # e.g. user-office/dev
  refreshAfter: 60s
  secrets:
    - name: duo-backend-secret
      rolloutRestartTargets:
        - kind: Deployment
          name: duo-backend
    - name: duo-core-database
      rolloutRestartTargets:
        - kind: Deployment
          name: duo-backend
        - kind: Deployment
          name: duo-factory
    - name: duo-scheduler-database
      condition: scheduler.enabled
      rolloutRestartTargets:
        - kind: Deployment
          name: duo-scheduler-backend
    - name: duo-rabbitmq-svcbind
      condition: rabbitmq.enabled
      rolloutRestartTargets:
        - kind: StatefulSet
          name: duo-rabbitmq
        - kind: Deployment
          name: duo-backend
        - kind: Deployment
          name: duo-scheduler-backend
