{{- /*
Application Secrets are synced from Vault by the Vault Secrets Operator.
Each entry in .Values.vault.secrets becomes a VaultStaticSecret that writes a
Secret of the same name. An entry with `condition` (e.g. scheduler.enabled) is
rendered only when that value is true.
*/ -}}
{{- $vault := .Values.vault -}}
{{- $pathPrefix := required "vault.pathPrefix is required" $vault.pathPrefix -}}
{{- range $secret := $vault.secrets }}
{{- $enabled := true -}}
{{- with $secret.condition }}
{{- $value := $.Values -}}
{{- range $key := splitList "." . }}
{{- $value = index $value $key -}}
{{- end }}
{{- $enabled = $value -}}
{{- end }}
{{- if $enabled }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secret.name | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  {{- with $vault.authRef }}
  vaultAuthRef: {{ . | quote }}
  {{- end }}
  mount: {{ required "vault.mount is required" $vault.mount | quote }}
  type: {{ required "vault.type is required" $vault.type | quote }}
  path: {{ printf "%s/%s" $pathPrefix ($secret.path | default $secret.name) | quote }}
  refreshAfter: {{ $vault.refreshAfter | quote }}
  destination:
    name: {{ $secret.name | quote }}
    create: true
    overwrite: true
  {{- with $secret.rolloutRestartTargets }}
  rolloutRestartTargets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
