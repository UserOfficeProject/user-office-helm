{{- $core := .Values.global.databases.core -}}
{{- $coreSecretName := required "global.databases.core.secretName is required" $core.secretName -}}
{{- $coreHost := required "global.databases.core.host is required" $core.host -}}
{{- $corePort := required "global.databases.core.port is required" $core.port -}}
{{- $coreDatabase := required "global.databases.core.database is required" $core.database -}}
{{- $coreUsername := required "global.databases.core.username is required" $core.username -}}
{{- $corePassword := required "global.databases.core.password is required" $core.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $coreSecretName | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
type: Opaque
stringData:
  host: {{ $coreHost | quote }}
  port: {{ $corePort | quote }}
  username: {{ $coreUsername | quote }}
  password: {{ $corePassword | quote }}
  database: {{ $coreDatabase | quote }}
  dbname: {{ $coreDatabase | quote }}
  uri: {{ printf "postgresql://%s:%s@%s:%v/%s" ($coreUsername | urlquery) ($corePassword | urlquery) $coreHost $corePort ($coreDatabase | urlquery) }}{{ with $core.sslMode }}?sslmode={{ . | urlquery }}{{ end }}
{{- if .Values.scheduler.enabled }}{{ printf "\n---\n" }}
{{- $scheduler := .Values.global.databases.scheduler -}}
{{- $schedulerSecretName := required "global.databases.scheduler.secretName is required when scheduler.enabled=true" $scheduler.secretName -}}
{{- $schedulerHost := required "global.databases.scheduler.host is required when scheduler.enabled=true" $scheduler.host -}}
{{- $schedulerPort := required "global.databases.scheduler.port is required when scheduler.enabled=true" $scheduler.port -}}
{{- $schedulerDatabase := required "global.databases.scheduler.database is required when scheduler.enabled=true" $scheduler.database -}}
{{- $schedulerUsername := required "global.databases.scheduler.username is required when scheduler.enabled=true" $scheduler.username -}}
{{- $schedulerPassword := required "global.databases.scheduler.password is required when scheduler.enabled=true" $scheduler.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $schedulerSecretName | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
type: Opaque
stringData:
  host: {{ $schedulerHost | quote }}
  port: {{ $schedulerPort | quote }}
  username: {{ $schedulerUsername | quote }}
  password: {{ $schedulerPassword | quote }}
  database: {{ $schedulerDatabase | quote }}
  dbname: {{ $schedulerDatabase | quote }}
  uri: {{ printf "postgresql://%s:%s@%s:%v/%s" ($schedulerUsername | urlquery) ($schedulerPassword | urlquery) $schedulerHost $schedulerPort ($schedulerDatabase | urlquery) }}{{ with $scheduler.sslMode }}?sslmode={{ . | urlquery }}{{ end }}
{{- end }}