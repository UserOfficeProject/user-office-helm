apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rabbitmq.fullname" . }}-definitions
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
data:
  rabbitmq.conf: |
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/definitions/load_definition.json
  load_definition.json: |
{{ .Files.Get "files/load_definition.json" | indent 4 }}