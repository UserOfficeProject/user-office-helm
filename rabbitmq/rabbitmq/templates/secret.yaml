{{- $username := required "rabbitmq.auth.username is required when RabbitMQ is enabled" .Values.auth.username -}}
{{- $password := required "rabbitmq.auth.password is required when RabbitMQ is enabled" .Values.auth.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rabbitmq.secretName" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ include "rabbitmq.fullname" . | quote }}
  port: {{ .Values.service.amqpPort | quote }}
  username: {{ $username | quote }}
  password: {{ $password | quote }}